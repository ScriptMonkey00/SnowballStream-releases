name: Question
description: Ask how to do something with SnowballStream
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        Check the [setup guide](https://snowballstream-production.up.railway.app/setup) first, it may already cover it. Issues here are **public**, so don't include passwords, tokens, or personal information.
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
